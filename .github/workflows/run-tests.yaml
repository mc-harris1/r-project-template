name: R quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    env:
      UVR_LIBRARY: /tmp/uvr-library
    steps:
      - uses: actions/checkout@v4

      - name: Install uvr
        run: |
          curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned R
        run: uvr r install 4.6.1

      - name: Restore locked environment
        run: uvr sync --frozen

      - name: Lint R source
        run: uvr run scripts/lint.R

      - name: Run unit tests
        run: uvr run tests/testthat.R
