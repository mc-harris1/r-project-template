name: R quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::lintr
            any::styler
            any::testthat
            any::ggplot2
            any::jsonlite

      - name: Lint R source
        run: Rscript scripts/lint.R

      - name: Run unit tests
        run: Rscript tests/testthat.R
